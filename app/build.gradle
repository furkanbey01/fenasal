plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fenasal.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fenasal.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
