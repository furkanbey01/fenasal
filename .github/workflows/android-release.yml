name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fena-android-signing-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify version metadata
        run: |
          grep -q "versionCode 20" app/build.gradle
          grep -q "versionName '1.0.20'" app/build.gradle
          grep -q '<string name="app_name">Fena</string>' app/src/main/res/values/strings.xml

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk Fena.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fena-v1.0.20
          path: Fena.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          TAG="v${VERSION}"
          test -n "$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG zaten yayınlanmış; mevcut release değiştirilmiyor."
            exit 0
          fi

          gh release create "$TAG" Fena.apk \
            --target "$GITHUB_SHA" \
            --title "Fena $TAG" \
            --notes "Fena $TAG: v1.0.19 bahis tetikleme regresyonu düzeltildi. Hızlı OCR alanı, final saniye zaman tahmini, daha dayanıklı değer tazeliği ve BET_GATE tanısı eklendi. Strateji eşikleri değiştirilmedi."
