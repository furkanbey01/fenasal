name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Fenasal.apk

      - name: Keep only v1.0.18 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "v1.0.18" ]; then
              gh release delete "$tag" --cleanup-tag --yes || true
            fi
          done

      - name: Update v1.0.18 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f v1.0.18 "$GITHUB_SHA"
          git push origin -f refs/tags/v1.0.18
          if gh release view v1.0.18 >/dev/null 2>&1; then
            gh release upload v1.0.18 Fenasal.apk --clobber
          else
            gh release create v1.0.18 Fenasal.apk \
              --title "Fenasal v1.0.18" \
              --notes "Baz sürüm: v1.0.18. Yalnızca overlay sürekli görünür olacak şekilde korunmuştur."
          fi
