name: Strategy v3 stability and round recovery

on:
  push:
    paths:
      - '.github/workflows/patch-v108.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply strategy v3 patch
        run: python tools/patch_strategy_v3.py

      - name: Commit strategy changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fenasal/app/ProjectionService.java
          git diff --cached --check
          git commit -m "Add strategy v3 round recovery"
          git push
