name: Add close-values bet guard

on:
  push:
    paths:
      - '.github/workflows/patch-v108.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add minimum spread guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/fenasal/app/ProjectionService.java')
          s = p.read_text(encoding='utf-8')
          constant_anchor = '    private static final float EMPTY_INK_MAX = 0.0065f;\n'
          constant = '    private static final double MIN_BET_SPREAD_RATIO = 0.35d;\n'
          if 'MIN_BET_SPREAD_RATIO' not in s:
              if constant_anchor not in s:
                  raise SystemExit('constant anchor not found')
              s = s.replace(constant_anchor, constant_anchor + constant, 1)
          old = (
              '        boolean accessibility = TapAccessibilityService.isReady();\n'
              '        if (!betPlaced\n'
              '                && lastFive\n'
              '                && oneSecondConfirmed\n'
              '                && freshCount == 3\n'
              '                && max >= 0\n'
              '                && min >= 0\n'
              '                && max != min) {\n'
          )
          new = (
              '        boolean accessibility = TapAccessibilityService.isReady();\n'
              '        double spreadRatio = (max >= 0 && min >= 0 && lastValues[max] > 0d)\n'
              '                ? (lastValues[max] - lastValues[min]) / lastValues[max]\n'
              '                : -1d;\n'
              '        boolean spreadEnough = spreadRatio >= MIN_BET_SPREAD_RATIO;\n\n'
              '        if (!betPlaced\n'
              '                && lastFive\n'
              '                && oneSecondConfirmed\n'
              '                && freshCount == 3\n'
              '                && max >= 0\n'
              '                && min >= 0\n'
              '                && max != min\n'
              '                && !spreadEnough) {\n'
              '            EventLog.log(this, String.format(Locale.ROOT,\n'
              '                    "BET_SKIP_CLOSE | high=%s low=%s | fark=%.1f%% | min=%.0f%%",\n'
              '                    formatAmount(lastValues[max]),\n'
              '                    formatAmount(lastValues[min]),\n'
              '                    spreadRatio * 100d,\n'
              '                    MIN_BET_SPREAD_RATIO * 100d));\n'
              '            betPlaced = true;\n'
              '            oneSecondConfirmed = false;\n'
              '        }\n\n'
              '        if (!betPlaced\n'
              '                && lastFive\n'
              '                && oneSecondConfirmed\n'
              '                && freshCount == 3\n'
              '                && max >= 0\n'
              '                && min >= 0\n'
              '                && max != min\n'
              '                && spreadEnough) {\n'
          )
          if old not in s:
              raise SystemExit('tap condition anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit source guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fenasal/app/ProjectionService.java
          git diff --cached --check
          git commit -m "Skip bet when high and low are too close"
          git push
