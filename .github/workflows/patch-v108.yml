name: Apply countdown fixes

on:
  push:
    paths:
      - '.github/workflows/patch-v108.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply source fixes
        run: |
          python tools/patch_last_second.py

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fenasal/app/ProjectionService.java
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Tap only on confirmed one-second countdown"
          git push
