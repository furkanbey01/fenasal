name: Keep overlay always visible

on:
  push:
    paths:
      - '.github/workflows/patch-v108.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make only the marker overlay always visible
        run: |
          python -c "from pathlib import Path; p=Path('app/src/main/java/com/fenasal/app/ProjectionService.java'); s=p.read_text(encoding='utf-8'); old='                lastFive,\\n                false);'; new='                true,\\n                false);'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1), encoding='utf-8')"

      - name: Commit the one-line behavior change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fenasal/app/ProjectionService.java
          git diff --cached --check
          git commit -m "Show high and low markers continuously"
          git push
