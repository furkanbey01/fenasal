name: Full per-hand logging

on:
  push:
    paths:
      - '.github/workflows/patch-v108.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply full logging patch
        run: python tools/patch_full_round_logging.py

      - name: Commit logging changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fenasal/app/ProjectionService.java \
                  app/src/main/java/com/fenasal/app/EventLog.java \
                  app/src/main/java/com/fenasal/app/MainActivity.java
          git diff --cached --check
          git commit -m "Log complete per-hand history"
          git push
