name: Apply v1.0.22 balance verification

on:
  push:
    branches: [ "fena-v1.0.22-balance-verification" ]
    paths:
      - '.github/workflows/patch-v1022.yml'
      - 'tools/patch_v1022.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fena-v1.0.22-balance-verification

      - name: Apply patch
        run: python tools/patch_v1022.py

      - name: Verify markers
        run: |
          grep -q 'BALANCE_X0' app/src/main/java/com/fenasal/app/ProjectionService.java
          grep -q 'BET_CONFIRMED_BALANCE' app/src/main/java/com/fenasal/app/ProjectionService.java
          grep -q 'BET_BALANCE_INCONCLUSIVE' app/src/main/java/com/fenasal/app/ProjectionService.java
          grep -q 'balanceRecognizer' app/src/main/java/com/fenasal/app/ProjectionService.java
          grep -q 'versionCode 22' app/build.gradle
          grep -q "versionName '1.0.22'" app/build.gradle

      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fenasal/app/ProjectionService.java app/build.gradle
          git diff --cached --check
          git commit -m "Add balance OCR and bet verification"
          git push origin HEAD:fena-v1.0.22-balance-verification
