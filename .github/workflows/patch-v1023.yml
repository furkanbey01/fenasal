name: Apply v1.0.23 game phase patch

on:
  push:
    branches: [ "fena-v1.0.23-game-phase" ]
    paths:
      - '.github/workflows/patch-v1023.yml'
      - 'tools/patch_v1023.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fena-v1.0.23-game-phase

      - name: Apply patch
        run: python tools/patch_v1023.py

      - name: Verify markers
        run: |
          grep -q 'PHASE_WHEEL' app/src/main/java/com/fenasal/app/ProjectionService.java
          grep -q 'OCR_IGNORED_PHASE' app/src/main/java/com/fenasal/app/ProjectionService.java
          grep -q 'ACTION_EVIDENCE' app/src/main/java/com/fenasal/app/ProjectionService.java
          grep -q 'containsBreakCue' app/src/main/java/com/fenasal/app/ProjectionService.java
          grep -q 'versionCode 23' app/build.gradle
          grep -q "versionName '1.0.23'" app/build.gradle

      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fenasal/app/ProjectionService.java app/build.gradle
          git diff --cached --check
          git commit -m "Add phase-aware OCR and action evidence"
          git push origin HEAD:fena-v1.0.23-game-phase
